<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ペイント</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
:root{--bg:#f3f3f3;--panel:#fbfbfb;--ink:#1b1b1b;--muted:#5d5d5d;--line:#e0e0e0;--hover:#ececec;--sel:#d6e8f8;--accent:#0067c0;--desk:#e9e9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202020;--panel:#2b2b2b;--ink:#fff;--muted:#b0b0b0;--line:#3d3d3d;--hover:#383838;--sel:#2f4256;--accent:#60cdff;--desk:#191919}}
:root[data-theme="dark"]{--bg:#202020;--panel:#2b2b2b;--ink:#fff;--muted:#b0b0b0;--line:#3d3d3d;--hover:#383838;--sel:#2f4256;--accent:#60cdff;--desk:#191919}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px "Segoe UI Variable","Segoe UI","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:4px;padding:6px 10px}
.top b{font-weight:600;margin-right:10px}
.top button{border:0;background:none;color:inherit;font:inherit;padding:5px 10px;border-radius:4px;cursor:pointer}
.top button:hover,.ib:hover{background:var(--hover)}
#title{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;height:28px;padding:0 8px;width:200px;max-width:40vw;user-select:text;-webkit-user-select:text}
.ribbon{display:flex;gap:0;overflow-x:auto;margin:0 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px 4px;flex:none;scrollbar-width:thin}
.g{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 10px;border-right:1px solid var(--line);flex:none;gap:4px}
.g:last-child{border:0}
.g .row{display:flex;gap:2px;align-items:center;flex:1}
.g small{color:var(--muted);font-size:11px}
.ib{width:34px;height:34px;border:0;background:none;color:var(--ink);border-radius:6px;display:grid;place-items:center;padding:0;position:relative;cursor:pointer}
.ib.on{background:var(--sel)}
.ib.on::after{content:"";position:absolute;left:9px;right:9px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
select,input[type=color]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;height:26px}
select{padding:0 4px;max-width:96px}
input[type=range]{width:96px;accent-color:var(--accent)}
#lwv{width:34px;text-align:right;color:var(--muted)}
#cur{position:relative;width:38px;height:38px;flex:none;margin-right:6px}
#cur div{position:absolute;width:22px;height:22px;border-radius:5px;border:1px solid var(--muted)}
#fgb{left:0;top:0;z-index:2}#bgb{right:0;bottom:0}
#cur div.t{box-shadow:0 0 0 2px var(--accent)}
#sw{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
#sw button{width:18px;height:18px;padding:0;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
#sw button:hover{transform:scale(1.2)}
#custom{width:30px;height:30px;padding:2px;margin-left:6px}
#desk{flex:1;min-width:0;min-height:0;margin:0;background:var(--desk);border-radius:8px;overflow:hidden;padding:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
#work{flex:1;min-height:0;display:flex;gap:8px;margin:8px 8px 0}
#lpanel{width:260px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.lh{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.lh b{font-weight:600}
.lbtns{display:flex}
.ib.sm{width:28px;height:28px}
.ib:disabled{opacity:.35;cursor:default}
.ib:disabled:hover{background:none}
#llist{flex:1;min-height:60px;overflow:auto;padding:4px;display:flex;flex-direction:column;gap:2px}
.lr{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.lr:hover{background:var(--hover)}
.lr.on{background:var(--sel);border-color:var(--accent)}
.lr .ib{width:28px;height:28px;flex:none}
.lr .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.lr.off .nm{color:var(--muted)}
.bgsw{width:16px;height:16px;border-radius:3px;border:1px solid var(--muted);flex:none;margin-left:2px}
#lset{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
.ls{display:flex;align-items:center;gap:8px}
.ls label{width:56px;flex:none;color:var(--muted)}
#lname{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;height:28px;padding:0 8px;user-select:text;-webkit-user-select:text}
#lname:disabled{opacity:.6}
#lop{flex:1;min-width:0}
#lopv{width:40px;text-align:right;color:var(--muted)}
#lbgc{width:44px;height:30px;padding:2px}
@media (max-width:720px){#work{flex-direction:column}#lpanel{width:auto;height:240px}}
#sheet{display:block;flex:none;line-height:0;background:conic-gradient(#d9d9d9 25%,#fff 0 50%,#d9d9d9 0 75%,#fff 0) 0 0/16px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25);touch-action:none}
.status{display:flex;gap:18px;padding:6px 14px;color:var(--muted);font-size:12px}
.status span:first-child{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#editor{flex:1;min-height:0;display:flex;flex-direction:column}
#home{flex:1;min-height:0;overflow:auto;padding:20px 20px 32px}
.hhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hhead h1{font-size:22px;font-weight:600;margin:0;flex:1}
.pbtn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 18px;border-radius:6px;cursor:pointer}
@media (prefers-color-scheme:dark){.pbtn{color:#00243d}}
.pbtn:hover{filter:brightness(1.08)}
.sub{color:var(--muted);margin:0 0 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--accent)}
.card .th{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .meta b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .meta span{color:var(--muted);font-size:11px}
.card .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-size:18px;line-height:1;padding:0;cursor:pointer;opacity:0;display:grid;place-items:center}
.card:hover .x,.card .x:focus-visible,.card .x.open{opacity:1}
@media (hover:none){.card .x{opacity:1}}
#menu{position:fixed;z-index:50;min-width:170px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:4px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:8px 12px;border-radius:5px;cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:var(--hover)}
#menu button.danger{color:#d13438}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:20px;width:min(360px,100%)}
.mbox p{margin:0 0 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.mbox input{width:100%;height:34px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 10px;margin-bottom:14px;user-select:text;-webkit-user-select:text}
.mrow{display:flex;justify-content:flex-end;gap:8px}
.mrow button{font:inherit;padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mrow button:hover{background:var(--hover)}
.mrow button.ok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.mrow button.ok.danger{background:#d13438;border-color:#d13438;color:#fff}
@media (prefers-color-scheme:dark){.mrow button.ok:not(.danger){color:#00243d}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:6px;z-index:60;max-width:90vw}
.card.new .th{background:var(--desk);color:var(--accent);font-size:42px;font-weight:300}
.empty{color:var(--muted);padding:24px 0}
</style>
</head>
<body>

<div id="home">
  <div class="hhead">
    <h1>ペイント</h1>
    <button class="pbtn" id="homeNew">＋ 新規作成</button>
  </div>
  <p class="sub">保存した絵（このブラウザに自動保存されています）</p>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>まだ絵がありません。「新規作成」から描き始めましょう。</div>
</div>

<div id="editor" hidden>
<div class="top"><button id="home_btn">← ホーム</button><input id="title" aria-label="タイトル" maxlength="40" placeholder="無題"><button id="save">画像として保存</button><button id="share">共有</button></div>
<div class="ribbon">
  <div class="g"><div class="row">
    <button class="ib" id="undo" title="元に戻す" data-ic="undo"></button>
    <button class="ib" id="redo" title="やり直し" data-ic="redo"></button>
    <button class="ib" id="del" title="削除" data-ic="trash"></button></div><small>編集</small></div>
  <div class="g"><div class="row" id="tools">
    <button class="ib" data-t="select" title="選択" data-ic="select"></button>
    <button class="ib on" data-t="pen" title="ペン" data-ic="pen"></button>
    <button class="ib" data-t="eraser" title="消しゴム" data-ic="eraser"></button>
    <button class="ib" data-t="text" title="テキスト" data-ic="text"></button></div><small>ツール</small></div>
  <div class="g"><div class="row" id="shapes">
    <button class="ib" data-t="line" title="直線" data-ic="line"></button>
    <button class="ib" data-t="arrow" title="矢印" data-ic="arrow"></button>
    <button class="ib" data-t="rect" title="四角形" data-ic="rect"></button>
    <button class="ib" data-t="ellipse" title="楕円" data-ic="ellipse"></button>
    <select id="fillm" aria-label="図形の塗り"><option value="outline">輪郭</option><option value="both">輪郭+塗り</option><option value="fill">塗りのみ</option></select></div><small>図形</small></div>
  <div class="g"><div class="row"><input type="range" id="lw" min="1" max="40" value="4" aria-label="サイズ"><span id="lwv">4px</span></div><small>サイズ</small></div>
  <div class="g"><div class="row">
    <div id="cur"><div id="bgb" style="background:#fff"></div><div id="fgb" class="t" style="background:#000"></div></div>
    <div id="sw"></div><input type="color" id="custom" value="#0067c0" title="色の編集"></div><small>色</small></div>
  <div class="g"><div class="row"><button class="ib" id="lbtn" title="レイヤー" aria-label="レイヤー" aria-expanded="false" data-ic="layers"></button></div><small>レイヤー</small></div>
</div>
<div id="work">
<div id="desk"><div id="sheet"><canvas id="c"></canvas></div></div>
<aside id="lpanel" hidden aria-label="レイヤー">
  <div class="lh"><b>レイヤー</b><div class="lbtns">
    <button class="ib sm" id="ladd" title="レイヤーを追加" aria-label="レイヤーを追加" data-ic="plus"></button>
    <button class="ib sm" id="lup" title="上へ" aria-label="上へ" data-ic="up"></button>
    <button class="ib sm" id="ldown" title="下へ" aria-label="下へ" data-ic="down"></button>
    <button class="ib sm" id="ldel" title="レイヤーを削除" aria-label="レイヤーを削除" data-ic="trash"></button>
    <button class="ib sm" id="lclose" title="閉じる" aria-label="閉じる" data-ic="close"></button>
  </div></div>
  <div id="llist"></div>
  <div id="lset">
    <div class="ls"><label for="lname">名前</label><input id="lname" maxlength="20"></div>
    <div class="ls" id="lopRow"><label for="lop">不透明度</label><input type="range" id="lop" min="0" max="100" value="100"><span id="lopv">100%</span></div>
    <div class="ls" id="lbgRow" hidden><label for="lbgc">背景色</label><input type="color" id="lbgc" value="#ffffff"></div>
  </div>
</aside>
</div>
<div class="status"><span id="hint"></span><span id="saved">自動保存: 待機中</span><span id="pos">0, 0 px</span><span id="size"></span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const P={select:'<path d="M6 3l12 9-5.5 1.2L9.5 19z"/>',pen:'<path d="M4 20l1-4L16 5l3 3L8 19z M14 7l3 3"/>',eraser:'<path d="M4 15l9-9 6 6-7 7H8z M9 20h11"/>',text:'<path d="M5 6V4h14v2 M12 4v16 M9 20h6"/>',line:'<path d="M5 19L19 5"/>',arrow:'<path d="M5 19L19 5 M10 5h9v9"/>',rect:'<rect x="4" y="6" width="16" height="12" rx="2"/>',ellipse:'<ellipse cx="12" cy="12" rx="8" ry="6"/>',undo:'<path d="M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-4"/>',redo:'<path d="M15 14l5-5-5-5 M20 9H10a6 6 0 000 12h4"/>',trash:'<path d="M5 7h14 M9 7V4h6v3 M7 7l1 13h8l1-13"/>',layers:'<path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"/>',close:'<path d="M6 6l12 12 M18 6L6 18"/>',plus:'<path d="M12 5v14 M5 12h14"/>',up:'<path d="M6 14l6-6 6 6"/>',down:'<path d="M6 10l6 6 6-6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M3 3l18 18 M10.6 6.1A9.7 9.7 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.9 M6.5 7.5A17 17 0 002 12s4 7 10 7c1.6 0 3-.4 4.3-1 M9.9 9.9a3 3 0 004.2 4.2"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 017.5-2"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';
document.querySelectorAll('[data-ic]').forEach(b=>{b.innerHTML=ic(b.dataset.ic)});

const dbp=new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));
  const r=indexedDB.open('paint-db',1);
  r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('meta',{keyPath:'id'});db.createObjectStore('data',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('blocked'));
});
function idb(stores,mode,fn){
  return dbp.then(db=>new Promise((res,rej)=>{
    const t=db.transaction(stores,mode);
    const req=fn(t);
    t.oncomplete=()=>res(req?req.result:undefined);
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error||new Error('aborted'));
  }));
}
const listMeta=()=>idb('meta','readonly',t=>t.objectStore('meta').getAll());
const getData=id=>idb('data','readonly',t=>t.objectStore('data').get(id));
const putMeta=m=>idb('meta','readwrite',t=>t.objectStore('meta').put(m));
const putDrawing=(m,d)=>idb(['meta','data'],'readwrite',t=>{t.objectStore('meta').put(m);t.objectStore('data').put(d)});
const delDrawing=id=>idb(['meta','data'],'readwrite',t=>{t.objectStore('meta').delete(id);t.objectStore('data').delete(id)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>{const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

const baseToObject=fabric.Object.prototype.toObject;
fabric.Object.prototype.toObject=function(p){const o=baseToObject.call(this,p);o.layer=this.layer;return o};
const isEraserStroke=o=>o.globalCompositeOperation==='destination-out';
function makeLayeredRender(getLayers){
  return function(ctx,objects){
    const list=objects.filter(Boolean),ls=getLayers();
    let i=0;
    while(i<list.length){
      let j=i;
      while(j<list.length&&list[j].layer===list[i].layer)j++;
      const run=list.slice(i,j);
      const L=ls.find(l=>l.id===list[i].layer);
      const a=L&&L.opacity!=null?L.opacity:1;
      if(!run.some(o=>o.visible)){i=j;continue}
      if(a<1||run.some(isEraserStroke)){
        const t=document.createElement('canvas');
        t.width=ctx.canvas.width;t.height=ctx.canvas.height;
        const tc=t.getContext('2d');
        tc.setTransform(ctx.getTransform());
        run.forEach(o=>o.render(tc));
        ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;ctx.drawImage(t,0,0);ctx.restore();
      }else run.forEach(o=>o.render(ctx));
      i=j;
    }
  };
}
const canvas=new fabric.Canvas('c',{backgroundColor:'#fff',selection:true,preserveObjectStacking:true});
canvas._renderObjects=makeLayeredRender(()=>layers);
let tool='pen',fg='#000000',bg='#ffffff',target='fg',lw=4,drawing=null,start=null,hist=[],redoS=[],busy=false,layers=[],activeLayer=null;
let curId=null,curCreated=0,dirty=false,saveTimer=null,chain=Promise.resolve();
const hints={select:'オブジェクトをクリックして移動・変形します。',eraser:'ドラッグで選択中のレイヤーの絵を消します。図形はクリックで削除。',pen:'ドラッグで自由に描きます。',text:'キャンバスをクリックして文字を入力します。',line:'ドラッグで直線を描きます。',arrow:'ドラッグで矢印を描きます。',rect:'ドラッグで四角形を描きます。',ellipse:'ドラッグで楕円を描きます。'};
const CW=1152,CH=648;
function fitView(){
  const d=$('desk');
  const aw=d.clientWidth-32,ah=d.clientHeight-32;
  if(aw<=0||ah<=0)return;
  const k=Math.min(aw/CW,ah/CH);
  canvas.setDimensions({width:Math.floor(CW*k)+'px',height:Math.floor(CH*k)+'px'},{cssOnly:true});
  canvas.calcOffset();
  canvas.renderAll();
}
function setSize(w,h){canvas.setWidth(w);canvas.setHeight(h);fitView();canvas.renderAll();$('size').textContent=w+' × '+h+' px'}
function fit(){setSize(CW,CH)}
new ResizeObserver(fitView).observe($('desk'));

'000000 7f7f7f 880015 ed1c24 ff7f27 fff200 22b14c 00a2e8 3f48cc a349a4 ffffff c3c3c3 b97a57 ffaec9 ffc90e efe4b0 b5e61d 99d9ea 7092be c8bfe7'.split(' ').forEach(h=>{
  const b=document.createElement('button');b.style.background='#'+h;b.title='#'+h;
  b.onclick=()=>setCol('#'+h);b.oncontextmenu=e=>{e.preventDefault();setCol('#'+h,'bg')};$('sw').appendChild(b)});
function setCol(c,t){t=t||target;if(t==='fg')fg=c;else bg=c;$(t==='fg'?'fgb':'bgb').style.background=c;applyBrush()}
function pick(t){target=t;$('fgb').classList.toggle('t',t==='fg');$('bgb').classList.toggle('t',t==='bg')}
$('fgb').onclick=()=>pick('fg');$('bgb').onclick=()=>pick('bg');
$('custom').oninput=e=>setCol(e.target.value);
$('lw').oninput=e=>{lw=+e.target.value;$('lwv').textContent=lw+'px';applyBrush()};

function setSaved(t){$('saved').textContent=t}
function scheduleSave(){if(!curId)return;dirty=true;setSaved('自動保存: 変更あり…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}
function saveNow(){clearTimeout(saveTimer);chain=chain.then(doSave);return chain}
async function doSave(){
  if(!curId||busy||!dirty)return;
  const id=curId,created=curCreated;
  try{
    const w=canvas.width,h=canvas.height;

  if(tool==='rect')drawing=new fabric.Rect({...base,width:0,height:0});

function normalizeLayers(list,color){
  const l=list.map(x=>({...x}));
  if(!l.some(x=>x.bg))l.unshift({id:uid(),name:'背景',visible:true,locked:false,bg:true,color:color||'#ffffff'});
  if(!l.some(x=>!x.bg))l.push({id:uid(),name:'レイヤー 1',visible:true,locked:false,opacity:1});

const layerOf=id=>layers.find(l=>l.id===id);
const firstDrawLayer=()=>layers.find(l=>!l.bg);

const editable=()=>{const L=layerOf(activeLayer);return !!L&&!L.bg&&L.visible&&!L.locked};
function blocked(){
  if(editable())return false;

  toast(L&&L.bg?'背景レイヤーには描けません。別のレイヤーを選んでください':L&&L.locked?'このレイヤーはロックされています':'このレイヤーは非表示です');

function reorder(){
  const idx={};layers.forEach((l,i)=>idx[l.id]=i);
  const a=canvas._objects;let ok=true;
  for(let i=1;i<a.length;i++){if((idx[a[i].layer]||0)<(idx[a[i-1].layer]||0)){ok=false;break}}
  if(ok)return;
  const s=a.map((o,i)=>[o,i]).sort((x,y)=>((idx[x[0].layer]||0)-(idx[y[0].layer]||0))||x[1]-y[1]).map(x=>x[0]);
  a.length=0;s.forEach(o=>a.push(o));
}
function applyBackground(){
  const B=layers[0];

function applyLayerState(){
  if(!layers.length)return;
  applyBackground();
  const sel=tool==='select';
  canvas.forEachObject(o=>{
    let L=layerOf(o.layer);
    if(!L||L.bg){L=firstDrawLayer();o.layer=L.id}
    const er=isEraserStroke(o);
    o.visible=L.visible;
    o.selectable=sel&&!L.locked&&!er;
    o.evented=(sel||(tool==='eraser'&&o.layer===activeLayer))&&!L.locked&&!er;
  });

function uiDialog({msg,input,value,ok='OK',cancel='キャンセル',danger}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const ov=document.createElement('div');ov.id='modal';
    const box=document.createElement('div');box.className='mbox';
    box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
    const p=document.createElement('p');p.textContent=msg;box.appendChild(p);
    let inp=null;
    if(input){inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.value=value||'';inp.setAttribute('aria-label',msg);box.appendChild(inp)}
    const row=document.createElement('div');row.className='mrow';
    const finish=v=>{ov.remove();try{prev&&prev.focus&&prev.focus()}catch(e){}res(v)};
    const cancelV=input?null:false;
    const okV=()=>input?inp.value:true;
    if(cancel!==null){const c=document.createElement('button');c.textContent=cancel;c.onclick=()=>finish(cancelV);row.appendChild(c)}
    const o=document.createElement('button');o.className='ok'+(danger?' danger':'');o.textContent=ok;o.onclick=()=>finish(okV());row.appendChild(o);
    box.appendChild(row);ov.appendChild(box);
    ov.addEventListener('mousedown',e=>{if(e.target===ov&&cancel!==null)finish(cancelV)});
    ov.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Escape'){e.preventDefault();finish(cancel!==null?cancelV:true)}
      else if(e.key==='Enter'&&e.target===inp){e.preventDefault();finish(okV())}
      else if(e.key==='Tab'){
        const f=[...box.querySelectorAll('input,button')];const i=f.indexOf(document.activeElement);
        e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
      }
    });
    document.body.appendChild(ov);
    if(inp){inp.focus();inp.select()}else(danger&&cancel!==null?row.firstChild:o).focus();
  });
}

  g.innerHTML='';
  const nb=document.createElement('div');nb.className='card new';nb.tabIndex=0;
  nb.innerHTML='<div class="th">＋</div><div class="meta"><b>新規作成</b><span>白紙から描き始める</span></div>';
  nb.onclick=newDrawing;nb.onkeydown=e=>{if(e.key==='Enter')newDrawing()};
  g.appendChild(nb);
  idx.forEach(m=>{
    const c=document.createElement('div');c.className='card';c.tabIndex=0;
    const th=document.createElement('div');th.className='th';
    const im=document.createElement('img');im.alt='';im.src=m.thumb||'';th.appendChild(im);
    const meta=document.createElement('div');meta.className='meta';
    const t=document.createElement('b');t.textContent=m.title||'無題';
    const s=document.createElement('span');s.textContent=fmt(m.updated);
    meta.append(t,s);
    const x=document.createElement('button');x.className='x';x.textContent='⋯';x.title='その他';
    x.setAttribute('aria-label','その他の操作');x.setAttribute('aria-haspopup','menu');
    x.onclick=e=>{e.stopPropagation();openMenu(x,m)};
    x.onkeydown=e=>e.stopPropagation();
    c.append(th,meta,x);
    c.onclick=()=>openDrawing(m.id);c.onkeydown=e=>{if(e.key==='Enter')openDrawing(m.id)};
    g.appendChild(c);
  });
  $('empty').hidden=idx.length>0;
}
renderHome();
</script>
</body>
</html>
