<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ブラウザで使えるシンプルなペイントツール。レイヤー対応で自由に絵を描けます。">
<meta name="robots" content="noindex, nofollow">
<title>ペイント</title>
<link href="favicon/32.png" rel="icon" sizes="32x32" type="image/png">
<link href="favicon/96.png" rel="icon" sizes="96x96" type="image/png">
<link href="favicon/144.png" rel="icon" sizes="144x144" type="image/png">
<link href="favicon/192.png" rel="icon" sizes="192x192" type="image/png">
<link href="favicon/512.png" rel="icon" sizes="512x512" type="image/png">
<link href="favicon/180.png" rel="apple-touch-icon" type="image/png">
<link href="favicon/152.png" rel="apple-touch-icon-precomposed" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.49.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
:root{--bg:#f3f3f3;--panel:#fbfbfb;--ink:#1b1b1b;--muted:#5d5d5d;--line:#e0e0e0;--hover:#ececec;--sel:#d6e8f8;--accent:#0067c0;--desk:#e9e9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202020;--panel:#2b2b2b;--ink:#fff;--muted:#b0b0b0;--line:#3d3d3d;--hover:#383838;--sel:#2f4256;--accent:#60cdff;--desk:#191919}}
:root[data-theme="dark"]{--bg:#202020;--panel:#2b2b2b;--ink:#fff;--muted:#b0b0b0;--line:#3d3d3d;--hover:#383838;--sel:#2f4256;--accent:#60cdff;--desk:#191919}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px "Segoe UI Variable","Segoe UI","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:4px;padding:6px 10px}
.top b{font-weight:600;margin-right:10px}
.top button{border:0;background:none;color:inherit;font:inherit;padding:5px 10px;border-radius:4px;cursor:pointer}
.top button{white-space:nowrap;flex:none}
.top #tbToggle{margin-left:auto;padding:0}
.top #tbToggle i{margin:0}
.top button:hover,.ib:hover{background:var(--hover)}
#title{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;height:28px;padding:0 8px;flex:1;width:auto;min-width:60px;max-width:200px;user-select:text;-webkit-user-select:text}
.ribbon{display:flex;gap:0;position:relative;margin:0 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px 4px;flex:none}
.g{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:0 10px;border-right:1px solid var(--line);flex:none;gap:4px}
.g:last-child{border:0}
.g .row{display:flex;gap:2px;align-items:center;flex:1}
.g small{color:var(--muted);font-size:11px}
.ib{width:34px;height:34px;border:0;background:none;color:var(--ink);border-radius:6px;display:grid;place-items:center;padding:0;position:relative;cursor:pointer}
.ib.on{background:var(--sel)}
.ib.on::after{content:"";position:absolute;left:9px;right:9px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
select,input[type=color]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;height:26px}
select{padding:0 4px;max-width:96px}
input[type=range]{width:96px;accent-color:var(--accent)}
#lwv{width:34px;text-align:right;color:var(--muted)}
#cur{position:relative;width:38px;height:38px;flex:none;margin-right:6px}
#cur div{position:absolute;width:22px;height:22px;border-radius:5px;border:1px solid var(--muted)}
#fgb{left:0;top:0;z-index:2}#bgb{right:0;bottom:0}
#cur div.t{box-shadow:0 0 0 2px var(--accent)}
#sw{display:grid;grid-template-columns:repeat(10,18px);gap:3px}
#sw button{width:18px;height:18px;padding:0;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
#sw button:hover{transform:scale(1.2)}
#custom{width:30px;height:30px;padding:2px;margin-left:6px}
@media (max-width:480px){.top{gap:2px;padding:6px}.top b{margin-right:4px}.top button{padding:5px 6px}.top button i{margin-right:2px}}
#palBtn{display:none}
.ribbon.c1 .g{padding:0 6px}
.ribbon.c1 .g small{display:none}
.ribbon.c1 .ib{width:30px;height:30px}
.ribbon.c1 .ib.on::after{left:7px;right:7px}
.ribbon.c1 input[type=range]{width:64px}
.ribbon.c1 select{max-width:80px}
.ribbon.c1 #lwv{width:30px}
.ribbon.c1 #cur{margin-right:2px}
.ribbon.c2 #palBtn{display:grid}
.ribbon.c2 #sw{display:none;position:absolute;left:4px;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.ribbon.c2.pal-open #sw{display:grid}
.ribbon.c3{flex-wrap:wrap;row-gap:4px}
.ribbon.c3 .g{padding:2px 6px}
#desk{flex:1;min-width:0;min-height:0;margin:0;background:var(--desk);border-radius:8px;overflow:auto;overscroll-behavior:contain;padding:16px;border:1px solid var(--line);display:flex}
#work{flex:1;min-height:0;display:flex;gap:8px;margin:8px 8px 0}
#lpanel{width:260px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.lh{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.lh b{font-weight:600}
.lbtns{display:flex}
.ib.sm{width:28px;height:28px}
.ib i{font-size:20px;line-height:1}
.grip i{font-size:16px}
.top button i,.pbtn i{margin-right:6px;font-size:16px;vertical-align:-2px}
.card .x i{font-size:18px;margin:0}
.card.new .th i{font-size:40px}
.ib:disabled{opacity:.35;cursor:default}
.ib:disabled:hover{background:none}
#llist{flex:1;min-height:60px;overflow:auto;padding:4px;display:flex;flex-direction:column;gap:2px}
.lr{display:flex;align-items:center;gap:2px;padding:2px 4px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.lr:hover{background:var(--hover)}
.lr.on{background:var(--sel);border-color:var(--accent)}
.lr .ib{width:28px;height:28px;flex:none}
.lr .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.lr.off .nm{color:var(--muted)}
.bgsw{width:16px;height:16px;border-radius:3px;border:1px solid var(--muted);flex:none;margin-left:2px}
#lset{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
.ls{display:flex;align-items:center;gap:8px}
.ls label{width:56px;flex:none;color:var(--muted)}
#lname{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;height:28px;padding:0 8px;user-select:text;-webkit-user-select:text}
#lname:disabled{opacity:.6}
#lop{flex:1;min-width:0}
#lopv{width:40px;text-align:right;color:var(--muted)}
#lbgRow{flex-direction:column;align-items:flex-start;gap:6px}
.bgl{display:flex;align-items:center;gap:8px}
#bgp{display:grid;grid-template-columns:repeat(10,16px);gap:3px}
#bgp button{width:16px;height:16px;padding:0;border-radius:50%;border:1px solid rgba(128,128,128,.5);cursor:pointer}
#bgp button:hover{transform:scale(1.2)}
#bgp button.cur{box-shadow:0 0 0 2px var(--accent)}
#lbgc{width:30px;height:30px;padding:2px}
.grip{width:16px;height:28px;display:grid;place-items:center;flex:none;color:var(--muted);touch-action:none;cursor:grab}
.lr.drag{opacity:.5}
.lr.drop-top{box-shadow:0 -2px 0 var(--accent)}
.lr.drop-bot{box-shadow:0 2px 0 var(--accent)}
#sheet{display:block;flex:none;margin:auto;line-height:0;background:conic-gradient(#d9d9d9 25%,#fff 0 50%,#d9d9d9 0 75%,#fff 0) 0 0/16px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25);touch-action:none}
.status{display:flex;align-items:center;gap:12px;height:34px;flex:none;overflow:hidden;white-space:nowrap;padding:0 14px;color:var(--muted);font-size:12px}
.status>*{flex:none}
#pos{min-width:84px;font-variant-numeric:tabular-nums}
@media (max-width:600px){.status{gap:8px;padding:0 8px}#size,#pos{display:none}}
.zoomc{display:flex;align-items:center;gap:2px;margin:-3px 0}
.zoomc .ib{width:26px;height:26px}
#zpct{min-width:52px;border:0;background:none;color:var(--ink);font:inherit;font-size:12px;padding:0 6px;height:26px;border-radius:6px;cursor:pointer}
#zpct:hover{background:var(--hover)}
.status>span:first-child{flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#editor{flex:1;min-height:0;display:flex;flex-direction:column}
#home{flex:1;min-height:0;overflow:auto;padding:20px 20px 32px}
.hhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hhead h1{font-size:22px;font-weight:600;margin:0;flex:1}
.pbtn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 18px;border-radius:6px;cursor:pointer}
@media (prefers-color-scheme:dark){.pbtn{color:#00243d}}
.pbtn:hover{filter:brightness(1.08)}
.pbtn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:400}
.sub{color:var(--muted);margin:0 0 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--accent)}
.card .th{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;display:block}
.card .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .meta b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .meta span{color:var(--muted);font-size:11px}
.card .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-size:18px;line-height:1;padding:0;cursor:pointer;opacity:0;display:grid;place-items:center}
.card:hover .x,.card .x:focus-visible,.card .x.open{opacity:1}
@media (hover:none){.card .x{opacity:1}}
#menu{position:fixed;z-index:50;min-width:170px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:4px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:8px 12px;border-radius:5px;cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:var(--hover)}
#menu button.danger{color:#d13438}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);padding:20px;width:min(360px,100%)}
.mbox p{margin:0 0 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.mbox input{width:100%;height:34px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 10px;margin-bottom:14px;user-select:text;-webkit-user-select:text}
.mrow{display:flex;justify-content:flex-end;gap:8px}
.mrow button{font:inherit;padding:7px 16px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.mrow button:hover{background:var(--hover)}
.mrow button.ok{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.mrow button.ok.danger{background:#d13438;border-color:#d13438;color:#fff}
@media (prefers-color-scheme:dark){.mrow button.ok:not(.danger){color:#00243d}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:6px;z-index:60;max-width:90vw}
.card.new .th{background:var(--desk);color:var(--accent)}
.empty{color:var(--muted);padding:24px 0}
.ribbon{display:none!important}
.msw{width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);display:inline-block;flex:none}
.top{height:48px;flex:none;padding:0 10px}
.top #tbToggle{display:none}
.top .ib{padding:0;width:34px;height:34px}
.top .ib i{margin:0;font-size:20px}
#home_btn{order:0}#title{order:1}#mundo{order:2}#mredo{order:3}#mimg{order:4}#mdel{order:5}#save{order:6;margin-left:auto}#share{order:7}#mmore{order:8;display:none}
#editor{position:relative}
#mdock{display:flex;flex-direction:column;flex:none;width:64px;gap:2px;padding:6px 4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto}
#mdock button{flex:none;height:56px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;position:relative;cursor:pointer}
#mdock button:hover{background:var(--hover)}
#mdock button i{font-size:22px;line-height:1;margin:0}
#mdock button span:not(#mcol){max-width:100%;padding:0 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
#mdock button.on{background:var(--sel)}
#mdock button.on,#mdock button.on span{color:var(--accent)!important}
#mdock button.on::after{content:"";position:absolute;left:0;top:30%;bottom:30%;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
#mcol{display:block;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:#000}
#msheet{position:absolute;left:80px;top:56px;width:340px;max-height:calc(100% - 112px);z-index:45;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.3);overflow:auto;padding:8px 12px 14px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh b{font-weight:600;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid.g4{grid-template-columns:repeat(4,1fr)}
.mbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-size:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;min-height:56px}
.mbtn:hover{background:var(--hover)}
.mbtn.on{background:var(--sel);border-color:var(--accent)}
.mbtn svg{width:64px;height:24px;display:block}
.mbtn i{font-size:22px;line-height:1}
.mseg{display:flex;gap:6px;margin-top:10px}
.mseg .mbtn{flex:1;min-height:44px;flex-direction:row;gap:8px}
#mpal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
#mpal button{aspect-ratio:1;min-width:0;border-radius:50%;border:1px solid rgba(128,128,128,.5);padding:0;cursor:pointer}
#mpal button:hover{transform:scale(1.15)}
.mrowx{display:flex;align-items:center;gap:10px;margin-top:12px}
.mrowx label{color:var(--muted);width:56px;flex:none}
.mrowx input[type=range]{flex:1;width:auto}
.mrowx input[type=color]{width:56px;height:36px;padding:2px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist .mbtn{flex-direction:row;justify-content:flex-start;padding:10px 12px;gap:10px;font-size:14px;min-height:46px}
@media (max-width:900px){#lpanel{width:220px}}
@media (max-height:640px){#mdock{gap:0}#mdock button{height:46px}#mdock button i{font-size:20px}#mcol{width:20px;height:20px}#msheet{top:52px}}
@media (max-width:720px),(pointer:coarse) and (max-height:500px){
.status{display:none!important}
.top{padding:0 6px;gap:4px}
.top #save,.top #share,.top .dtop{display:none}
.top #mmore{display:grid}
.top .ib{width:40px;height:40px}
.top .ib i{font-size:22px}
.top #home_btn{font-size:0;padding:0;width:40px;height:40px;display:grid;place-items:center}
.top #home_btn i{font-size:22px;margin:0}
#title{max-width:none;height:36px;font-size:15px}
#work{display:contents}
#desk{margin:0 4px;padding:6px;order:1}
#lpanel{position:absolute;left:0;right:0;bottom:58px;width:auto;height:auto;max-height:50vh;z-index:40;border-radius:14px 14px 0 0;border-bottom:0;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
#llist{max-height:30vh}
.lr{min-height:44px}
.lr .ib{width:40px;height:40px}
.grip{width:24px;height:40px}
#mdock{order:2;flex-direction:row;width:auto;height:58px;margin-top:4px;gap:0;padding:0;border:0;border-top:1px solid var(--line);border-radius:0;touch-action:manipulation}
#mdock button{flex:1;height:auto;min-width:0;border-radius:0}
#mdock button:hover{background:none}
#mdock button.on{background:none}
#mdock button.on::after{left:28%;right:28%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
#msheet{left:0;right:0;top:auto;bottom:58px;width:auto;max-height:55vh;border-radius:14px 14px 0 0;border-bottom:0;box-shadow:0 -6px 24px rgba(0,0,0,.25);touch-action:manipulation}
}
.mfonts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mfont{min-height:52px;gap:2px;padding:6px 4px}
.mfont .s{font-size:18px;line-height:1.3;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mfont .n{font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<input type="file" id="imgIn" accept="image/*" hidden>

<div id="home">
  <div class="hhead">
    <h1>ペイント</h1>
    <button class="pbtn" id="homeNew"><i class="ti ti-plus" aria-hidden="true"></i>新規作成</button>
    <button class="pbtn sec" id="homeImg"><i class="ti ti-photo-plus" aria-hidden="true"></i>画像から新規作成</button>
  </div>
  <p class="sub">保存した絵（このブラウザに自動保存されています）</p>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>まだ絵がありません。「新規作成」から描き始めましょう。</div>
</div>

<div id="editor" hidden>
<div class="top"><button id="home_btn"><i class="ti ti-arrow-left" aria-hidden="true"></i>ホーム</button><input id="title" aria-label="タイトル" maxlength="40" placeholder="無題"><button id="save">画像として保存</button><button id="share">共有</button><button class="ib mtop" id="mundo" title="元に戻す" aria-label="元に戻す" data-ic="undo"></button><button class="ib mtop" id="mredo" title="やり直し" aria-label="やり直し" data-ic="redo"></button><button class="ib dtop" id="mimg" title="画像を読み込む" aria-label="画像を読み込む" data-ic="photo"></button><button class="ib dtop" id="mdel" title="選択を削除 (Delete)" aria-label="選択を削除" data-ic="trash"></button><button class="ib mtop" id="mmore" title="その他" aria-label="その他" data-ic="more"></button><button class="ib" id="tbToggle" title="ツールバーを隠す" aria-label="ツールバーを隠す" aria-expanded="true" data-ic="up"></button></div>
<div class="ribbon">
  <div class="g"><div class="row">
    <button class="ib" id="undo" title="元に戻す" data-ic="undo"></button>
    <button class="ib" id="redo" title="やり直し" data-ic="redo"></button>
    <button class="ib" id="del" title="削除" data-ic="trash"></button></div><small>編集</small></div>
  <div class="g"><div class="row" id="tools">
    <button class="ib" data-t="select" title="選択" data-ic="select"></button>
    <button class="ib on" data-t="pen" title="ペン" data-ic="pen"></button>
    <button class="ib" data-t="eraser" title="消しゴム" data-ic="eraser"></button>
    <button class="ib" data-t="text" title="テキスト" data-ic="text"></button></div><small>ツール</small></div>

<script>
const $=id=>document.getElementById(id);
const P={select:'ti ti-pointer',pen:'ti ti-pencil',eraser:'ti ti-eraser',text:'ti ti-typography',line:'ti ti-line',arrow:'ti ti-arrow-up-right',rect:'ti ti-rectangle',ellipse:'ti ti-circle',undo:'ti ti-arrow-back-up',redo:'ti ti-arrow-forward-up',trash:'ti ti-trash',grip:'ti ti-grip-vertical',layers:'ti ti-stack-2',close:'ti ti-x',plus:'ti ti-plus',up:'ti ti-chevron-up',down:'ti ti-chevron-down',eye:'ti ti-eye',eyeoff:'ti ti-eye-off',lock:'ti ti-lock',unlock:'ti ti-lock-open',back:'ti ti-arrow-left',more:'ti ti-dots',photo:'ti ti-photo-plus',zoomin:'ti ti-zoom-in',zoomout:'ti ti-zoom-out',dblarrow:'ti ti-arrows-horizontal',roundrect:'ti ti-square-rounded',triangle:'ti ti-triangle',diamond:'ti ti-diamond',pentagon:'ti ti-pentagon',hexagon:'ti ti-hexagon',star:'ti ti-star',heart:'ti ti-heart',bubble:'ti ti-message',cross:'ti ti-plus'};
const ic=n=>'<i class="'+P[n]+'" aria-hidden="true"></i>';
document.querySelectorAll('[data-ic]').forEach(b=>{b.innerHTML=ic(b.dataset.ic)});

const dbp=new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));
  const r=indexedDB.open('paint-db',1);
  r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore('meta',{keyPath:'id'});db.createObjectStore('data',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
  r.onblocked=()=>rej(new Error('blocked'));
});
function idb(stores,mode,fn){
  return dbp.then(db=>new Promise((res,rej)=>{
    const t=db.transaction(stores,mode);
    const req=fn(t);
    t.oncomplete=()=>res(req?req.result:undefined);
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error||new Error('aborted'));
  }));
}
const listMeta=()=>idb('meta','readonly',t=>t.objectStore('meta').getAll());
const getData=id=>idb('data','readonly',t=>t.objectStore('data').get(id));
const putMeta=m=>idb('meta','readwrite',t=>t.objectStore('meta').put(m));
const putDrawing=(m,d)=>idb(['meta','data'],'readwrite',t=>{t.objectStore('meta').put(m);t.objectStore('data').put(d)});
const delDrawing=id=>idb(['meta','data'],'readwrite',t=>{t.objectStore('meta').delete(id);t.objectStore('data').delete(id)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=t=>{const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

const baseToObject=fabric.Object.prototype.toObject;
fabric.Object.prototype.toObject=function(p){const o=baseToObject.call(this,p);o.layer=this.layer;return o};
const isEraserStroke=o=>o.globalCompositeOperation==='destination-out';
function makeLayeredRender(getLayers){
  return function(ctx,objects){
    const list=objects.filter(Boolean),ls=getLayers();
    let i=0;
    while(i<list.length){
      let j=i;
      while(j<list.length&&list[j].layer===list[i].layer)j++;
      const run=list.slice(i,j);
      const L=ls.find(l=>l.id===list[i].layer);
      const a=L&&L.opacity!=null?L.opacity:1;
      if(!run.some(o=>o.visible)){i=j;continue}
      if(a<1||run.some(isEraserStroke)){
        const t=document.createElement('canvas');
        t.width=ctx.canvas.width;t.height=ctx.canvas.height;
        const tc=t.getContext('2d');
        tc.setTransform(ctx.getTransform());
        run.forEach(o=>o.render(tc));
        ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;ctx.drawImage(t,0,0);ctx.restore();
      }else run.forEach(o=>o.render(ctx));
      i=j;
    }
  };
}
const canvas=new fabric.Canvas('c',{backgroundColor:'#fff',selection:true,preserveObjectStacking:true});
canvas._renderObjects=makeLayeredRender(()=>layers);
const PENS={pen:{k:1,a:1},pencil:{k:.7,a:.75},fine:{k:.4,a:1},marker:{k:2.5,a:.6,cap:'square'},highlighter:{k:6,a:.3,cap:'square'},dashed:{k:1,a:1,cap:'butt',dash:true},neon:{k:1,a:1,glow:3},spray:{k:3,a:1,spray:true},dots:{k:3,a:1,dots:true}};
let penType='pen';
const hexA=(c,a)=>{const h=c.replace('#','');const n=parseInt(h.length===3?h.replace(/./g,'$&$&'):h,16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'};
let tool='pen',fg='#000000',bg='#ffffff',target='fg',lw=4,drawing=null,start=null,hist=[],redoS=[],busy=false,layers=[],activeLayer=null;
let curId=null,curCreated=0,dirty=false,saveTimer=null,chain=Promise.resolve();
const hints={select:'オブジェクトをクリックして移動・変形します。',eraser:'ドラッグで選択中のレイヤーの絵を消します。図形はクリックで削除。',pen:'ドラッグで自由に描きます。ペンの種類を切り替えられます。',text:'キャンバスをクリックして文字を入力します。もう一度「文字」を押すとフォントなどを変更できます。',line:'ドラッグで直線を描きます。',arrow:'ドラッグで矢印を描きます。',rect:'ドラッグで四角形を描きます。',ellipse:'ドラッグで楕円を描きます。'};
const CW=1152,CH=648;
const ZMIN=0.1,ZMAX=8;
let zoom=1,viewK=1;
const SEL_COLOR='#ff5a00';
function applySelectionStyle(sc){
  const o=fabric.Object.prototype;
  o.borderColor=SEL_COLOR;
  o.borderDashArray=null;
  o.cornerColor='#ffffff';
  o.cornerStrokeColor=SEL_COLOR;
  o.cornerStyle='circle';
  o.transparentCorners=false;
  o.cornerSize=14/sc;
  o.touchCornerSize=30/sc;
  o.borderScaleFactor=2.5/sc;
  o.padding=3/sc;
  o.borderOpacityWhenMoving=1;
  canvas.selectionColor='rgba(255,90,0,.12)';
  canvas.selectionBorderColor=SEL_COLOR;
  canvas.selectionLineWidth=2/sc;
}
function fitView(){
  const d=$('desk');
  const cs=getComputedStyle(d),px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),py=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const aw=d.offsetWidth-d.clientLeft*2-px,ah=d.offsetHeight-d.clientTop*2-py;
  if(aw<=0||ah<=0)return;
  viewK=Math.min(aw/CW,ah/CH);
  zoom=Math.max(ZMIN/viewK,Math.min(zoom,ZMAX/viewK));
  const sc=viewK*zoom;
  canvas.setDimensions({width:Math.floor(CW*sc)+'px',height:Math.floor(CH*sc)+'px'},{cssOnly:true});
  canvas.calcOffset();
  applySelectionStyle(sc);
  canvas.renderAll();
  $('zpct').textContent=$('mzpct').textContent=Math.round(sc*100)+'%';
  $('zin').disabled=zoom>=ZMAX/viewK-1e-6;
  $('zout').disabled=zoom<=ZMIN/viewK+1e-6;
}
function setZoom(z,cx,cy){
  const d=$('desk'),sh=$('sheet');
  z=Math.max(ZMIN/viewK,Math.min(z,ZMAX/viewK));
  if(Math.abs(z-zoom)<1e-9)return;
  const r=sh.getBoundingClientRect();
  if(cx==null){const dr=d.getBoundingClientRect();cx=dr.left+dr.width/2;cy=dr.top+dr.height/2}
  const fx=Math.max(0,Math.min(1,(cx-r.left)/r.width)),fy=Math.max(0,Math.min(1,(cy-r.top)/r.height));
  zoom=z;fitView();
  const n=sh.getBoundingClientRect();
  d.scrollLeft+=n.left+fx*n.width-cx;
  d.scrollTop+=n.top+fy*n.height-cy;
}
function resetZoom(){zoom=1;fitView();$('desk').scrollLeft=0;$('desk').scrollTop=0}
$('zin').onclick=()=>setZoom(zoom*1.25);
$('zout').onclick=()=>setZoom(zoom/1.25);
$('zpct').onclick=resetZoom;
$('desk').addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();
  setZoom(zoom*Math.exp(-e.deltaY*0.0025),e.clientX,e.clientY);
},{passive:false});
let pinch=null;
const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const tCtr=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
function cancelStroke(){
  canvas._isCurrentlyDrawing=false;
  canvas._currentTransform=null;
  canvas._groupSelector=null;
  if(canvas.contextTop)canvas.clearContext(canvas.contextTop);
  if(drawing){busy=true;canvas.remove(drawing);busy=false;drawing=null}
  textAt=null;
}
$('desk').addEventListener('touchstart',e=>{
  if(e.touches.length<2)return;
  e.preventDefault();e.stopPropagation();
  if(e.touches.length===2){
    cancelStroke();
    const c=tCtr(e.touches);
    pinch={d:tDist(e.touches),z:zoom,x:c.x,y:c.y};
  }
},{capture:true,passive:false});
$('desk').addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;
  e.preventDefault();e.stopPropagation();
  const c=tCtr(e.touches),d=$('desk');
  setZoom(pinch.z*tDist(e.touches)/pinch.d,c.x,c.y);
  d.scrollLeft-=c.x-pinch.x;
  d.scrollTop-=c.y-pinch.y;
  pinch.x=c.x;pinch.y=c.y;
},{capture:true,passive:false});
const endPinch=e=>{if(e.touches.length<2)pinch=null};
$('desk').addEventListener('touchend',endPinch,true);
$('desk').addEventListener('touchcancel',endPinch,true);
function setSize(w,h){canvas.setWidth(w);canvas.setHeight(h);fitView();canvas.renderAll();$('size').textContent=w+' × '+h+' px'}
function fit(){setSize(CW,CH)}
new ResizeObserver(fitView).observe($('desk'));

const COLORS='000000 7f7f7f 880015 ed1c24 ff7f27 fff200 22b14c 00a2e8 3f48cc a349a4 ffffff c3c3c3 b97a57 ffaec9 ffc90e efe4b0 b5e61d 99d9ea 7092be c8bfe7'.split(' ');
COLORS.forEach(h=>{
  const b=document.createElement('button');b.style.background='#'+h;b.title='#'+h;
  b.onclick=()=>setCol('#'+h);b.oncontextmenu=e=>{e.preventDefault();setCol('#'+h,'bg')};$('sw').appendChild(b)});
function setCol(c,t){t=t||target;if(t==='fg')fg=c;else bg=c;$(t==='fg'?'fgb':'bgb').style.background=c;syncMobileColor();applyBrush()}
function pick(t){target=t;$('fgb').classList.toggle('t',t==='fg');$('bgb').classList.toggle('t',t==='bg');syncMobileColor()}
$('fgb').onclick=()=>pick('fg');$('bgb').onclick=()=>pick('bg');
const ribbonEl=document.querySelector('.ribbon');
function closePal(){ribbonEl.classList.remove('pal-open');$('palBtn').setAttribute('aria-expanded','false')}
function placePal(){
  const rr=ribbonEl.getBoundingClientRect(),br=$('palBtn').getBoundingClientRect(),sw=$('sw');
  const left=br.left+br.width/2-rr.left-sw.offsetWidth/2;
  sw.style.left=Math.max(4,Math.min(left,rr.width-sw.offsetWidth-4))+'px';
  sw.style.top=(br.bottom-rr.top+4)+'px';
}
$('palBtn').onclick=e=>{e.stopPropagation();const o=ribbonEl.classList.toggle('pal-open');$('palBtn').setAttribute('aria-expanded',String(o));if(o)placePal()};
document.addEventListener('click',e=>{if(!e.target.closest('#sw')||e.target.closest('#sw button'))closePal()});
function fitRibbon(){
  if($('editor').hidden)return;
  ribbonEl.classList.remove('c1','c2','c3');
  closePal();
  for(const c of ['c1','c2','c3']){
    if(ribbonEl.scrollWidth<=ribbonEl.clientWidth+1)break;
    ribbonEl.classList.add(c);
  }
}
function setToolbar(show){
  ribbonEl.hidden=!show;
  const b=$('tbToggle');
  b.innerHTML=ic(show?'up':'down');
  b.title=b.ariaLabel=show?'ツールバーを隠す':'ツールバーを表示';
  b.setAttribute('aria-label',b.title);
  b.setAttribute('aria-expanded',String(show));
  closePal();
  if(show)fitRibbon();
  try{localStorage.setItem('toolbarHidden',show?'0':'1')}catch(e){}
}
$('tbToggle').onclick=()=>setToolbar(ribbonEl.hidden);
let tbHidden=false;
try{tbHidden=localStorage.getItem('toolbarHidden')==='1'}catch(e){}
if(tbHidden)setToolbar(false);
addEventListener('resize',fitRibbon);
addEventListener('orientationchange',fitRibbon);
$('custom').oninput=e=>setCol(e.target.value);
function setLw(v){lw=v;$('lw').value=v;$('mlw').value=v;$('lwv').textContent=v+'px';$('mlwv').textContent=v+'px';applyBrush()}
$('lw').oninput=e=>setLw(+e.target.value);
$('mlw').oninput=e=>setLw(+e.target.value);

function setSaved(t){$('saved').textContent=t}
function scheduleSave(){if(!curId)return;dirty=true;setSaved('自動保存: 変更あり…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}
function saveNow(){clearTimeout(saveTimer);chain=chain.then(doSave);return chain}
async function doSave(){
  if(!curId||busy||!dirty)return;
  const id=curId,created=curCreated;
  try{
    const w=canvas.width,h=canvas.height;
    const c=canvas.toJSON(),ly=layers.map(l=>({...l})),ac=activeLayer;
    const thumb=canvas.toDataURL({format:'png',multiplier:Math.min(1,360/w)});
    const now=Date.now();
    dirty=false;
    await putDrawing({id,title:$('title').value.trim(),created,updated:now,thumb},{id,w,h,c,layers:ly,active:ac});
    setSaved('自動保存: '+fmt(now).slice(-5)+' 保存済み');
  }catch(e){
    dirty=true;setSaved('自動保存に失敗しました（容量不足の可能性）');
  }
}
addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
$('title').oninput=()=>{document.title='ペイント - '+($('title').value.trim()||'無題');scheduleSave()};

function snapshot(){return JSON.stringify({c:canvas.toJSON(),layers:layers,active:activeLayer})}
function snap(){if(busy)return;hist.push(snapshot());if(hist.length>60)hist.shift();redoS=[];scheduleSave()}
function load(s){
  const o=JSON.parse(s);
  layers=o.layers.map(l=>({...l}));activeLayer=o.active;
  busy=true;
  canvas.loadFromJSON(o.c,()=>{canvas.renderAll();renderLayers();setTool(tool);busy=false;scheduleSave();loadUsedFonts(canvas.getObjects()).then(r=>{if(r)canvas.requestRenderAll()})});
}
canvas.on('object:added',e=>{if(!e.target.layer)e.target.layer=drawLayerId();reorder()});
canvas.on('object:added',snap);canvas.on('object:modified',snap);canvas.on('object:removed',snap);
$('undo').onclick=()=>{if(hist.length>1){redoS.push(hist.pop());load(hist[hist.length-1])}};
$('redo').onclick=()=>{if(redoS.length){const s=redoS.pop();hist.push(s);load(s)}};

const CURVES={
  heart:[['M',.5,1],['C',.1,.68,0,.42,0,.27],['C',0,.1,.12,0,.27,0],['C',.38,0,.46,.06,.5,.14],['C',.54,.06,.62,0,.73,0],['C',.88,0,1,.1,1,.27],['C',1,.42,.9,.68,.5,1],['Z']],

function makeShape(t,x0,y0,x1,y1,shift){
  const isLine=t==='line'||t==='arrow'||t==='dblarrow';
  if(shift){
    const dx=x1-x0,dy=y1-y0;
    if(isLine){const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4,r=Math.hypot(dx,dy);x1=x0+r*Math.cos(a);y1=y0+r*Math.sin(a)}
    else{const m=Math.max(Math.abs(dx),Math.abs(dy));x1=x0+m*(dx<0?-1:1);y1=y0+m*(dy<0?-1:1)}
  }
  const l=Math.min(x0,x1),tp=Math.min(y0,y1),w=Math.abs(x1-x0),h=Math.abs(y1-y0);
  const base={stroke:fg,strokeWidth:lw,fill:fillOf(),strokeLineJoin:'round',selectable:false,evented:false};
  if(t==='rect')return new fabric.Rect({...base,left:l,top:tp,width:w,height:h});
  if(t==='roundrect'){const r=Math.min(w,h)*.2;return new fabric.Rect({...base,left:l,top:tp,width:w,height:h,rx:r,ry:r})}
  if(t==='ellipse')return new fabric.Ellipse({...base,left:l,top:tp,rx:w/2,ry:h/2});
  if(isLine){
    const ln=new fabric.Line([x0,y0,x1,y1],{...base,fill:fg,strokeLineCap:'round'});
    if(t==='line')return ln;
    const a=Math.atan2(y1-y0,x1-x0),hs=10+lw*2;
    const head=(x,y,ang)=>new fabric.Triangle({left:x,top:y,originX:'center',originY:'center',width:hs,height:hs,fill:fg,angle:ang});
    const parts=[ln,head(x1,y1,a*180/Math.PI+90)];
    if(t==='dblarrow')parts.push(head(x0,y0,a*180/Math.PI-90));
    return new fabric.Group(parts,{selectable:false,evented:false});
  }
  if(POLY[t])return new fabric.Polygon(POLY[t].map(q=>({x:l+q[0]*w,y:tp+q[1]*h})),base);
  const d=CURVES[t].map(c=>c.map((v,k)=>k===0?v:(k%2===1?l+v*w:tp+v*h)).join(' ')).join(' ');
  return new fabric.Path(d,base);
}

const GUIDE_COLOR='#ff2d95',ANGLE_COLOR='#00b050';

canvas.on('after:render',()=>{

  ctx.save();

    ctx.setLineDash(g.solid?[]:[6/sc,4/sc]);
    g.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
    ctx.stroke();
  });
  ctx.setLineDash([]);
  guideLabels.forEach(l=>{
    const fs=(l.hit?15:12)/sc,pad=5/sc;
    ctx.font=(l.hit?'bold ':'')+fs+'px "Segoe UI","Noto Sans JP",sans-serif';
    ctx.textBaseline='middle';
    const tw=ctx.measureText(l.text).width,h=fs+pad*2;
    let x=l.x+10/sc,y=l.y-18/sc;

    y=Math.max(h/2+2/sc,Math.min(y,CH-h/2-2/sc));

const nearestRight=a=>{const n=Math.round(a/90)*90;return{n:((n%360)+360)%360,hit:Math.abs(a-n)<3}};

function lineSnap(p,show){
  const isLine=tool==='line'||tool==='arrow'||tool==='dblarrow';
  if(show){guideLines=[];guideLabels=[]}
  if(!isLine||!start)return p;
  const dx=p.x-start.x,dy=p.y-start.y,len=Math.hypot(dx,dy);
  if(len<3)return p;
  let a=(Math.atan2(-dy,dx)*180/Math.PI+360)%360;
  const r=nearestRight(a);
  let q=p;
  if(r.hit){
    const rad=r.n*Math.PI/180,ux=Math.cos(rad),uy=-Math.sin(rad);
    q={x:start.x+len*ux,y:start.y+len*uy};
    a=r.n;
    if(show){
      const sc=viewScale(),s=16/sc,vx=-uy,vy=ux;
      guideLines.push({c:ANGLE_COLOR,pts:[[start.x-ux*CW,start.y-uy*CW],[start.x+ux*CW,start.y+uy*CW]]});
      guideLines.push({c:ANGLE_COLOR,pts:[[start.x-vx*CW,start.y-vy*CW],[start.x+vx*CW,start.y+vy*CW]]});
      guideLines.push({c:ANGLE_COLOR,w:2.5,solid:true,pts:[[start.x+ux*s,start.y+uy*s],[start.x+(ux+vx)*s,start.y+(uy+vy)*s],[start.x+vx*s,start.y+vy*s]]});
    }
  }
  if(show)guideLabels.push({x:q.x,y:q.y,text:angleText(a,r.hit),hit:r.hit});
  return q;
}

canvas.on('object:moving',e=>{
  const t=e.target;
  if(!t)return;
  const th=6/viewScale();
  const skip=new Set(t._objects||[]);skip.add(t);
  const xs=[0,CW/2,CW],ys=[0,CH/2,CH];
  canvas.getObjects().forEach(o=>{
    if(skip.has(o)||!o.visible||isEraserStroke(o))return;
    const b=o.getBoundingRect(true,true);
    xs.push(b.left,b.left+b.width/2,b.left+b.width);
    ys.push(b.top,b.top+b.height/2,b.top+b.height);
  });
  const r=t.getBoundingRect(true,true);
  const mx=[r.left,r.left+r.width/2,r.left+r.width],my=[r.top,r.top+r.height/2,r.top+r.height];
  const best=(mine,cands)=>{
    let d=null,at=0;
    mine.forEach(m=>cands.forEach(c=>{const v=c-m;if(Math.abs(v)<=th&&(d===null||Math.abs(v)<Math.abs(d))){d=v;at=c}}));
    return{d,at};
  };
  const bx=best(mx,xs),by=best(my,ys);
  guideLines=[];guideLabels=[];
  if(bx.d!==null){t.set('left',t.left+bx.d);guideLines.push({c:GUIDE_COLOR,pts:[[bx.at,0],[bx.at,CH]]})}
  if(by.d!==null){t.set('top',t.top+by.d);guideLines.push({c:GUIDE_COLOR,pts:[[0,by.at],[CW,by.at]]})}
  t.setCoords();
  canvas.requestRenderAll();
});
canvas.on('object:rotating',e=>{

  const r=nearestRight(a);
  if(r.hit){t.set('angle',r.n);a=r.n;t.setCoords()}

  }else{
    guideLines.push({c:GUIDE_COLOR,w:1,pts:[[c.x,0],[c.x,CH]]});

function defaultLayers(color){

function normalizeLayers(list,color){

  if(!l.some(x=>x.bg))l.unshift({id:uid(),name:'背景',visible:true,locked:false,bg:true,color:color||'#ffffff'});

const layerOf=id=>layers.find(l=>l.id===id);
const firstDrawLayer=()=>layers.find(l=>!l.bg);
const drawLayerId=()=>{const L=layerOf(activeLayer);return(L&&!L.bg)?L.id:firstDrawLayer().id};

  toast(L&&L.bg?'背景レイヤーには描けません。別のレイヤーを選んでください':L&&L.locked?'このレイヤーはロックされています':'このレイヤーは非表示です');

function reorder(){

  const a=canvas._objects;let ok=true;
  for(let i=1;i<a.length;i++){if((idx[a[i].layer]||0)<(idx[a[i-1].layer]||0)){ok=false;break}}
  if(ok)return;
  const s=a.map((o,i)=>[o,i]).sort((x,y)=>((idx[x[0].layer]||0)-(idx[y[0].layer]||0))||x[1]-y[1]).map(x=>x[0]);
  a.length=0;s.forEach(o=>a.push(o));
}
function applyBackground(){

function applyLayerState(){

    let L=layerOf(o.layer);

    const er=isEraserStroke(o);

function hookEraser(b){
  let prev=null;
  const mv=b.onMouseMove.bind(b),up=b.onMouseUp.bind(b);
  b.onMouseMove=function(pt,o){
    mv(pt,o);
    if(!this._points||this._points.length<2)return;
    const d=this.convertPointsToSVGPath(this._points);
    if(this._isEmptySVGPath&&this._isEmptySVGPath(d))return;
    const path=this.createPath(d);
    path.set({stroke:'#000',globalCompositeOperation:'destination-out',selectable:false,evented:false,layer:activeLayer});
    busy=true;if(prev)canvas.remove(prev);canvas.add(path);busy=false;prev=path;
  };

    if(prev){busy=true;canvas.remove(prev);busy=false;prev=null}
    return up(o);
  };

  if(to===from)return;
  disp.splice(from,1);disp.splice(to,0,id);

function startDrag(e,row,L){

  const list=$('llist'),y0=e.clientY;

  const rows=()=>[...list.children].filter(r=>!r.classList.contains('bgrow'));
  const clear=()=>rows().forEach(r=>r.classList.remove('drop-top','drop-bot'));
  const move=ev=>{
    if(!on){if(Math.abs(ev.clientY-y0)<5)return;on=true;row.classList.add('drag')}
    const rs=rows();ins=0;
    rs.forEach(r=>{const bx=r.getBoundingClientRect();if(ev.clientY>bx.top+bx.height/2)ins++});
    clear();
    rs[Math.min(ins,rs.length-1)].classList.add(ins<rs.length?'drop-top':'drop-bot');
  };
  const end=ev=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    if(!on)return;
    dragMoved=true;setTimeout(()=>{dragMoved=false},0);
    row.classList.remove('drag');clear();
    if(ev.type==='pointerup')dropLayer(L.id,ins);
  };

  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
}

function uiDialog({msg,input,value,ok='OK',cancel='キャンセル',danger}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const ov=document.createElement('div');ov.id='modal';
    const box=document.createElement('div');box.className='mbox';
    box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
    const p=document.createElement('p');p.textContent=msg;box.appendChild(p);
    let inp=null;
    if(input){inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.value=value||'';inp.setAttribute('aria-label',msg);box.appendChild(inp)}
    const row=document.createElement('div');row.className='mrow';
    const finish=v=>{ov.remove();try{prev&&prev.focus&&prev.focus()}catch(e){}res(v)};
    const cancelV=input?null:false;
    const okV=()=>input?inp.value:true;
    if(cancel!==null){const c=document.createElement('button');c.textContent=cancel;c.onclick=()=>finish(cancelV);row.appendChild(c)}
    const o=document.createElement('button');o.className='ok'+(danger?' danger':'');o.textContent=ok;o.onclick=()=>finish(okV());row.appendChild(o);
    box.appendChild(row);ov.appendChild(box);
    ov.addEventListener('mousedown',e=>{if(e.target===ov&&cancel!==null)finish(cancelV)});
    ov.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Escape'){e.preventDefault();finish(cancel!==null?cancelV:true)}
      else if(e.key==='Enter'&&e.target===inp){e.preventDefault();finish(okV())}
      else if(e.key==='Tab'){
        const f=[...box.querySelectorAll('input,button')];const i=f.indexOf(document.activeElement);
        e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
      }
    });
    document.body.appendChild(ov);
    if(inp){inp.focus();inp.select()}else(danger&&cancel!==null?row.firstChild:o).focus();
  });
}

function prepImage(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const nw=im.naturalWidth,nh=im.naturalHeight;
      if(!nw||!nh){URL.revokeObjectURL(u);rej(new Error('size'));return}
      const k=Math.min(1,1920/Math.max(nw,nh));
      const w=Math.max(1,Math.round(nw*k)),h=Math.max(1,Math.round(nh*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(u);
      const alpha=/png|gif|webp|svg/.test(file.type);
      res({url:c.toDataURL(alpha?'image/png':'image/jpeg',.92),w,h});
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};
    im.src=u;
  });
}
function placeImage(p,fill){
  return new Promise(res=>{
    fabric.Image.fromURL(p.url,img=>{
      const k=Math.min(CW/p.w,CH/p.h),s=fill?k:Math.min(1,k);
      img.set({left:(CW-p.w*s)/2,top:(CH-p.h*s)/2,scaleX:s,scaleY:s});
      canvas.add(img);setTool('select');canvas.setActiveObject(img);canvas.renderAll();res();
    });
  });
}

function penSvg(k){
  const t=PENS[k];
  if(t.spray||t.dots){
    const n=t.spray?23:15,st=t.spray?2.4:3.8;
    let c='';
    for(let i=0;i<n;i++){
      const x=6+i*st,y=12+Math.sin(i*(t.spray?1:1.6)/3.5)*7+(t.spray?((i*7)%5-2)*1.4:0);
      c+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(t.spray?(0.9+(i%3)*0.3).toFixed(1):2.2)+'"/>';
    }
    return '<svg viewBox="0 0 64 24" fill="currentColor" aria-hidden="true">'+c+'</svg>';
  }
  const w=Math.max(1.5,Math.min(11,4*t.k));
  const dash=t.dash?' stroke-dasharray="'+w*2+' '+w*2+'"':'';
  const glow=t.glow?' style="filter:drop-shadow(0 0 3px currentColor)"':'';
  return '<svg viewBox="0 0 64 24" aria-hidden="true"'+glow+'><path d="M6 17C18 3 30 3 36 12S50 21 58 7" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-opacity="'+t.a+'" stroke-linecap="'+(t.cap||'round')+'" stroke-linejoin="round"'+dash+'/></svg>';
}

$('mzout').onclick=()=>$('zout').click();
$('mzin').onclick=()=>$('zin').click();
$('mzpct').onclick=()=>$('zpct').click();
$('desk').addEventListener('pointerdown',closeSheet,true);
const FONTS=[
  {n:'ゴシック',css:'"Segoe UI","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif'},
  {n:'明朝',css:'"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif',g:'Noto+Serif+JP:wght@400;700',fam:'Noto Serif JP'},
  {n:'丸ゴシック',css:'"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',g:'Zen+Maru+Gothic:wght@400;700',fam:'Zen Maru Gothic'},
  {n:'教科書体風',css:'"Klee One","Yu Kyokasho",serif',g:'Klee+One:wght@400;600',fam:'Klee One'},
  {n:'マジック',css:'"Yusei Magic",cursive',g:'Yusei+Magic',fam:'Yusei Magic'},
  {n:'ポップ',css:'"Hachi Maru Pop",cursive',g:'Hachi+Maru+Pop',fam:'Hachi Maru Pop'},
  {n:'極太',css:'"Dela Gothic One",sans-serif',g:'Dela+Gothic+One',fam:'Dela Gothic One'},
  {n:'筆文字',css:'"Potta One",serif',g:'Potta+One',fam:'Potta One'},
  {n:'ロック',css:'"RocknRoll One",sans-serif',g:'RocknRoll+One',fam:'RocknRoll One'},
  {n:'等幅',css:'ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace'},
  {n:'欧文セリフ',css:'Georgia,"Times New Roman",serif'}
];
let textSize=32,textFont=FONTS[0].css,textBold=false,textItalic=false;
FONTS.filter(f=>f.g).forEach(f=>{
  const l=document.createElement('link');l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family='+f.g+'&display=swap';
  document.head.appendChild(l);
});
function ensureFont(f,bold){
  if(!f||!f.g||!document.fonts)return Promise.resolve();
  const sample='あア漢Aa1';
  return Promise.all([document.fonts.load('32px "'+f.fam+'"',sample),bold?document.fonts.load('bold 32px "'+f.fam+'"',sample):null]).catch(()=>{});
}
function loadUsedFonts(list){
  const used=new Set(list.map(o=>o.fontFamily).filter(Boolean));
  const fs=FONTS.filter(f=>f.g&&used.has(f.css));
  if(!fs.length||!document.fonts)return Promise.resolve(false);
  return Promise.all(fs.map(f=>ensureFont(f,true))).then(()=>{
    list.forEach(o=>{if(o.fontFamily&&o.initDimensions){o.initDimensions();o.dirty=true;o.setCoords()}});
    return true;
  });
}
function activeText(){
  const o=canvas.getActiveObject();
  return o&&(o.type==='i-text'||o.type==='textbox'||o.type==='text')?o:null;
}
function applyText(props,noSnap){
  const o=activeText();
  if(!o)return;
  o.set(props);
  o.initDimensions();o.setCoords();
  canvas.requestRenderAll();
  if(!noSnap)snap();
}
function renderTextSheet(){
  document.querySelectorAll('#mfonts [data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===textFont));
  $('mbold').classList.toggle('on',textBold);
  $('mitalic').classList.toggle('on',textItalic);
  $('mts').value=textSize;$('mtsv').textContent=Math.round(textSize)+'px';
}
function syncTextFromSelection(){
  const o=activeText();
  if(o){
    textFont=o.fontFamily;textBold=o.fontWeight==='bold'||+o.fontWeight>=600;textItalic=o.fontStyle==='italic';
    textSize=Math.max(8,Math.min(200,Math.round(o.fontSize)));
  }
  renderTextSheet();
}
function chooseFont(f){
  textFont=f.css;renderTextSheet();
  ensureFont(f,textBold).then(()=>applyText({fontFamily:f.css}));
}
FONTS.forEach(f=>{
  const b=document.createElement('button');b.className='mbtn mfont';b.dataset.f=f.css;
  b.innerHTML='<span class="s">あア漢 Abc</span><span class="n">'+f.n+'</span>';
  b.firstChild.style.fontFamily=f.css;
  b.onclick=()=>chooseFont(f);
  $('mfonts').appendChild(b);
});
$('mbold').onclick=()=>{textBold=!textBold;renderTextSheet();const f=FONTS.find(x=>x.css===textFont);ensureFont(f,textBold).then(()=>applyText({fontWeight:textBold?'bold':'normal'}))};
$('mitalic').onclick=()=>{textItalic=!textItalic;renderTextSheet();applyText({fontStyle:textItalic?'italic':'normal'})};
$('mts').oninput=e=>{textSize=+e.target.value;$('mtsv').textContent=textSize+'px';applyText({fontSize:textSize},true)};
$('mts').onchange=()=>{if(activeText())snap()};

const KEYS={v:'select',p:'pen',e:'eraser',t:'text',l:'line',a:'arrow',r:'rect',o:'ellipse'};
const DOCK_TITLES={select:'選択 (V)',pen:'ペン (P)',eraser:'消しゴム (E)',shape:'図形 (L / A / R / O)',text:'文字 (T)',color:'色とサイズ ([ ] でサイズ変更)',layers:'レイヤー'};
document.querySelectorAll('#mdock [data-mt]').forEach(b=>b.title=DOCK_TITLES[b.dataset.mt]);
$('mimg').onclick=()=>$('imgBtn').click();
$('mdel').onclick=()=>$('del').click();
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
updateMobile();syncMobileColor();
renderHome();
</script>
